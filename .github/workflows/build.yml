name: Build Zalo for Linux

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      zalo_version:
        description: 'Zalo version (empty = latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    # Build on the OLDEST supported base so the native libs' glibc / libstdc++ /
    # OpenSSL requirements stay low → the .deb runs on the widest range of distros.
    # 22.04 = glibc 2.35 + OpenSSL 3 (libcrypto.so.3). Don't drop to 20.04: it ships
    # OpenSSL 1.1 (no libcrypto.so.3) and its runner is being retired.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            p7zip-full build-essential libssl-dev liblzma-dev libsqlcipher-dev \
            dpkg fakeroot cmake nasm ninja-build patchelf git curl \
            python3 python3-pil \
            meson pkg-config autoconf automake libtool gettext autopoint libglib2.0-dev-bin

      - name: Ensure modern 7-Zip (7zz)
        # Ubuntu 22.04 only ships legacy p7zip 16.02 (`7z`), which fails to read
        # Zalo's DMG ("Headers Error"). extract-installer.js prefers `7zz`; make sure
        # it exists. Try the `7zip` apt package, else drop in the official static build.
        run: |
          if command -v 7zz >/dev/null; then 7zz i | head -2; exit 0; fi
          if sudo apt-get install -y 7zip && command -v 7zz >/dev/null; then 7zz i | head -2; exit 0; fi
          echo "apt 7zip unavailable — fetching static 7zz"
          curl -fL https://www.7-zip.org/a/7z2409-linux-x64.tar.xz -o /tmp/7z.tar.xz
          tar -C /tmp -xJf /tmp/7z.tar.xz 7zz
          sudo install -m 755 /tmp/7zz /usr/local/bin/7zz
          7zz i | head -2

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Setup + Build
        id: build
        env:
          ZALO_VERSION: ${{ github.event.inputs.zalo_version }}
        run: npm run main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.deb_name }}
          path: ${{ steps.build.outputs.deb_file }}
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.build.outputs.deb_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
