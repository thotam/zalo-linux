[package]
name = "file-utilities"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
walkdir = "=2.5.0"
same-file = "=1.0.6"
lazy_static = "=1.5.0"
globset = "0.4"
num_cpus = "1"
libc = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
