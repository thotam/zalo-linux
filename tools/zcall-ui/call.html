<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'" />
  <link rel="stylesheet" href="icons.css" />
  <link rel="stylesheet" href="call.css" />
  <title>Zalo Call</title>
</head>
<body data-state="calling">
  <div id="titlebar">
    <span class="tb-icon zic zic-call"></span>
    <span class="tb-title" id="tb-title">Zalo Call</span>
    <span class="tb-spacer"></span>
    <div class="wc" id="wc-min" title="Thu nhỏ"><i class="wc-min-i"></i></div>
    <div class="wc" id="wc-max" title="Phóng to"><i class="wc-max-i"></i></div>
    <div class="wc wc-close" id="wc-close" title="Đóng"><i class="wc-x"></i></div>
  </div>
  <div id="stage">
    <div id="bg"></div>
    <div id="timer">00:00</div>
    <div id="avatar-wrap">
      <div id="ring"></div>
      <div id="avatar"></div>
    </div>
    <div id="status"></div>
    <div id="endtoast"></div>

    <div id="bar">
      <div class="pill">
        <button class="ctl pill-main" id="btn-cam"><span class="zic zic-cam"></span></button>
        <button class="ctl pill-chev" id="cam-chev"><span class="zic zic-chevron-up"></span></button>
      </div>
      <button class="ctl" id="btn-end"><span class="zic zic-endcall"></span></button>
      <div class="pill">
        <button class="ctl pill-main" id="btn-mic"><span class="zic zic-mic"></span></button>
        <button class="ctl pill-chev" id="mic-chev"><span class="zic zic-chevron-up"></span></button>
      </div>
      <button class="ctl" id="btn-gear"><span class="zic zic-gear"></span></button>
    </div>
    <div id="mic-menu"></div>
  </div>

  <script src="call-format.js"></script>
  <script src="call.js"></script>
</body>
</html>
